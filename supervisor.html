<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <!-- ========== 1.0 Meta ========== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYPilot - Supervisor</title>

    <!-- Inline SVG favicon: no file or library needed -->
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%230066B3'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23FFD500'/%3E%3C/svg%3E">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/supervisor.css">
    <link rel="stylesheet" href="assets/css/extras.css">
</head>

<body>
    <!-- ========== 2.0 Sidebar ========== -->
    <aside class="sidebar glass">
        <a href="supervisor.html" class="brand">
            <i class="ri-compass-3-line"></i>
            <span><em>FYP</em>ilot</span>
        </a>

        <nav class="nav-links">
            <button class="nav-btn active" data-section="topics"><i
                    class="ri-lightbulb-line"></i><span>Topics</span></button>
            <button class="nav-btn" data-section="students"><i class="ri-team-line"></i><span>Students</span></button>
            <button class="nav-btn" data-section="reviews"><i
                    class="ri-file-search-line"></i><span>Reviews</span></button>
            <button class="nav-btn" id="logoutBtn"><i class="ri-logout-box-r-line"></i><span>Log out</span></button>
        </nav>

        <button class="theme-btn neu neu-circle" id="themeToggle" aria-label="Toggle theme">
            <i class="ri-moon-line"></i>
        </button>
    </aside>

    <!-- ========== 3.0 Main Area ========== -->
    <main class="dash-main">
        <div class="dash-inner">

            <!-- ========== 3.1 Top Bar ========== -->
            <header class="topline">
                <div class="greet">
                    <h2 id="pageTitle">My topics</h2>
                    <p id="todayLine"></p>
                </div>
                <div class="actions">
                    <div class="avatar neu neu-circle">
                        <div class="profile-icon"><i class="ri-user-star-line"></i></div>
                    </div>
                </div>
            </header>

            <!-- ========== 4.0 Topics (home) ========== -->
            <section class="view active" id="topics">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: .6rem;">
                    <p class="section-label">Your topics</p>
                    <button class="btn btn-primary btn-small" id="newTopic"><i class="ri-add-line"></i> New
                        topic</button>
                </div>
                <ul class="rows" id="topicRows"></ul>
            </section>

            <!-- ========== 5.0 Students (placeholder) ========== -->
            <section class="view" id="students">
                <p class="lead">Students appear here once they pick one of your topics.</p>
            </section>

            <!-- ========== 6.0 Reviews (placeholder) ========== -->
            <section class="view" id="reviews">
                <p class="lead">Submitted documents appear here for review.</p>
            </section>

        </div>
    </main>

    <!-- ========== 7.0 New Topic Drawer ========== -->
    <div class="drawer-wrap" id="drawerWrap">
        <div class="drawer glass" role="dialog" aria-labelledby="drawerTitle">
            <div class="drawer-head">
                <h3 id="drawerTitle">New topic</h3>
                <button class="close neu neu-circle" id="closeTopic" aria-label="Close"><i
                        class="ri-close-line"></i></button>
            </div>

            <form id="topicForm" class="log-form">
                <label>Title
                    <input type="text" id="topicTitle" required
                        placeholder="Web Based Final Year Project Supervision System">
                </label>

                <label>Description
                    <textarea id="topicDesc" rows="3" placeholder="What the project is about"></textarea>
                </label>

                <label>Objectives (one per line)
                    <textarea id="topicObjectives" rows="4"
                        placeholder="Develop a database for managing students&#10;Implement student-supervisor allocation"></textarea>
                </label>

                <label>Technologies
                    <input type="text" id="topicTech" placeholder="Python, Django, PostgreSQL">
                </label>

                <label>Other requirements
                    <textarea id="topicReqs" rows="2" placeholder="Web programming, database design"></textarea>
                </label>

                <button type="submit" class="btn btn-primary submit">Submit for approval</button>
                <p class="thread-note">The coordinator approves each topic before students can see it.</p>
            </form>
        </div>
    </div>

    <!-- ========== 8.0 Toast ========== -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- ========== 9.0 Scripts ========== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/supervisor.js" defer></script>
</body>

</html>
